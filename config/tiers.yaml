# Capability tiers — the platform/SRE triage ladder.
#
# A tier is a NAME plus the gateway request fields that name expands to. Nothing
# in s15code knows any of these names, providers or models: add a tier, rename a
# tier, or repoint one at a different provider entirely by editing this file.
#
# `order` is the ladder, cheapest first. `policy.py` walks it downwards when the
# run is under budget pressure, so the order is the only thing that defines what
# "downgrade" means.

order: [economy, standard, frontier]
default_tier: standard

# ── The ladder is CROSS-MODEL, and it is LOCAL ───────────────────────────────
# The shipped ladder was groq / gemini / github. This machine has no provider
# credentials at all, so every rung here is an Ollama model, served by one of
# two daemons:
#
#   rung      provider      model          params  declared $/Mtok in/out
#   economy   ollama        llama3.2:1b     1.2B   0.10 / 0.40
#   standard  ollama        qwen2.5:3b      3.1B   0.30 / 1.20
#   frontier  ollama_edge   qwen2.5:7b      7.6B   1.00 / 4.00
#
# Three things about that table are worth stating plainly rather than burying.
#
#   The rates are DECLARED, not billed. Local inference costs electricity, and a
#   rung priced at $0.00 cannot be exhausted by a dollar ceiling — "refuse at
#   exhaustion" would stop being expressible in money and collapse entirely onto
#   max_calls_per_run. Each rate is anchored to what the 2026 hosted market
#   charges for an open-weight model of that size, so the ladder's ~10x shape
#   matches a real one. Token counts, latencies, stop reasons and refusals are
#   all measured; only the per-token rate is synthetic.
#
#   `ollama` and `ollama_edge` are two daemons on one machine, not two vendors.
#   `ollama` is the stock server on 11434; `ollama_edge` is a second
#   `ollama serve` on 11435, registered as its own gateway slot with its own
#   queue, rate state and circuit breaker. Failover and benching between them
#   are real. Vendor diversity is not: one `pkill ollama` takes out both, which
#   a groq/gemini/github ladder would survive.
#
#   No rung sends `reasoning`. Every model here is a plain instruct model with
#   no separate thinking channel, so the dial the session's §2 is about has
#   nothing to switch off. Sending it anyway would be decoration.
#
# Capability rises with parameter count across the rungs, which is the ordering
# assumption the ladder encodes. §11 of the session warns that this is an
# assumption and not a truth ranking, and the PART 2 evidence in the README
# reports where it turned out to be wrong on this task class.

tiers:
  economy:
    # Every key under `request` is merged verbatim into the gateway's /v1/chat
    # body. That is the whole tier -> provider mapping: no Python edit needed to
    # change a provider, a model, a reasoning effort or a token ceiling.
    request:
      provider: ollama
      model: llama3.2:1b
      max_tokens: 512
      temperature: 0
    # Which row of pricing.yaml this tier is billed against. Defaults to the
    # request model when omitted.
    price_model: llama3.2:1b
    # What the estimator assumes before the call returns, in tokens. Real usage
    # replaces this the moment the response lands.
    projected_input_tokens: 900
    projected_output_tokens: 300

  standard:
    request:
      provider: ollama
      model: qwen2.5:3b
      max_tokens: 1024
      temperature: 0
    price_model: qwen2.5:3b
    projected_input_tokens: 1400
    projected_output_tokens: 600

  frontier:
    request:
      provider: ollama_edge
      model: qwen2.5:7b
      max_tokens: 2048
      temperature: 0
    price_model: qwen2.5:7b
    projected_input_tokens: 2200
    projected_output_tokens: 1200

# Which tier a graph ROLE asks for. Keys are the runtime's own skill/role names
# (never task content), so a node "declares the tier it needs" by declaring its
# role. `default` covers every role not listed.
#
# The shape of this map is the policy: retrieval and reformatting are bulk work
# that a 1B model does acceptably, diagnosis is where a wrong answer costs an
# on-call engineer an hour, and the node that actually writes the answer to the
# operator is the one worth paying for.
role_tiers:
  default: standard
  # Bulk work: fetch it, list it, restate it. Cheapest rung, no escalation.
  memory_recall: economy
  remember_explicit_fact: economy
  web_search: economy
  fetch_url: economy
  index_file: economy
  list_directory: economy
  read_file: economy
  create_reminder: economy
  researcher: economy
  retriever: economy
  summariser: economy
  formatter: economy
  # Middle rung: work that must be right but is recoverable if it is not.
  distiller: standard
  content: standard
  coder_validator: standard
  compose_surface: standard
  # The node that answers the operator. A wrong runbook step here is the
  # expensive mistake this ladder exists to avoid.
  answer_with_evidence: frontier
