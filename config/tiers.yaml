# Capability tiers.
#
# A tier is a NAME plus the gateway request fields that name expands to. Nothing
# in s15code knows any of these names, providers or models: add a tier, rename a
# tier, or repoint one at a different provider entirely by editing this file.
#
# `order` is the ladder, cheapest first. `policy.py` walks it downwards when the
# run is under budget pressure, so the order is the only thing that defines what
# "downgrade" means.

order: [economy, standard, frontier]
default_tier: standard

# ── The ladder is CROSS-MODEL ────────────────────────────────────────────────
# The first version of this file varied reasoning effort and the output ceiling
# on ONE model. The arithmetic worked — output is billed 6x input, so capping
# max_tokens does cap spend — but it made "model routing" only half-true: every
# rung of the ladder was the same model, so a downgrade could never be a change
# of model, only a change of how hard that one model was allowed to think.
#
# Each rung below is a DIFFERENT model on a DIFFERENT provider, and the three
# were measured against glc_v4 on 2026-07-30 before being written down. One
# identical 3-sentence prompt, max_tokens 512, temperature 0, reasoning off:
#
#   rung      provider    model                    $/Mtok in/out  latency  answered
#   economy   groq        openai/gpt-oss-120b      0.15 / 0.75    0.74 s   yes
#   standard  gemini      gemini-3.1-flash-lite    0.25 / 1.50    1.24 s   yes
#   frontier  gemini      gemini-2.5-flash         0.30 / 2.50    n/m      yes
#
# ── 2026-08-11: the frontier rung was REPLACED ───────────────────────────────
# Rung 3 was github / openai/gpt-4.1 at 2.00/8.00 until GitHub Models entered its
# retirement brownout (HTTP 410 github_models_retirement_brownout) and stopped
# answering every request. The top of the ladder had to be rebuilt from providers
# still reachable on free tiers.
#
# The first attempt was cerebras / zai-glm-4.7 at 0.50/0.50, and it FAILED p7 —
# worth recording, because the failure is the instructive part. Its output rate
# (0.50) is below the economy rung's (0.75), and output dominates every real call,
# so the measured ladder came out INVERTED: frontier $0.00004750 against economy
# $0.00008025, a 0.59x "spread". p7's check "the top rung measurably costs more
# than the bottom rung" caught it. A rung that costs less than the one below it is
# not a frontier, whatever its projected worst case says.
#
# gemini-2.5-flash restores monotonicity on BOTH rates, which is what makes "one
# rung down" unambiguous:
#
#   input rate    0.15 -> 0.25 -> 0.30    rises
#   output rate   0.75 -> 1.50 -> 2.50    rises
#
# Two spreads, and they are very different numbers. p7 on a one-sentence task,
# 2026-08-11:
#
#   projected worst case   0.00039090 -> 0.00154750 -> 0.01025380    26.2x
#   actually charged       0.00008025 -> 0.00010025 -> 0.00014870     1.85x
#
# The projected figures are what ADMISSION reads, and they are dominated by each
# rung's `max_tokens` ceiling. The charged figures are what the LEDGER records, and
# on a short task every rung emitted a similar ~60-token answer, so the 26x design
# spread collapsed to under 2x in practice.
#
# That gap is the single most important thing to understand about this ladder.
# Break-even resolution rate computed from the projected spread is ~3.8%; computed
# from the measured spread it is ~54%. The second number is the honest one for
# short tasks, and it means the cheap rung has to be right MOST of the time to pay
# for itself — nothing like the "cheap rung only needs 1 in 80" story the original
# 79x github ladder told. The spread only approaches its design value on tasks
# whose answers are long enough for the frontier rung to use its token budget.
#
# (`projected_input_tokens` below is only a FALLBACK estimate. Admission prices the
# real prompt when it has one, which is why these numbers are not what you get by
# multiplying the configured token counts by the rates.)
#
# Two rungs now share the gemini provider. p7 requires the ladder to span MORE
# THAN ONE provider, not three, so groq + gemini satisfies it — but the ladder is
# less provider-diverse than the original, and an outage at Google now takes out
# two rungs instead of one. That is a real fragility, not a cosmetic one.
#
# Rung 3 is priced from glc_v4's own table, so the ledger cannot disagree with it.
# Point frontier back at github if the service ever returns.
#
# Two facts worth keeping, both learned the hard way:
#
#   `reasoning: "off"` is not decoration on the cheap rung. gpt-oss-120b thinks
#   by default: at max_tokens 128 with the dial left alone it spent all 128
#   output tokens in its reasoning channel and returned content "" — a fully
#   billed non-answer. The same call with the dial off returned a 570-character
#   answer in 117 tokens. glc_v4's providers.py now translates "off" into the
#   dialect each server understands; the tier only has to ask.
#
#   The cheapest rung is deliberately NOT free. This gateway can also reach
#   ollama/gemma4:31b and openrouter's nvidia/nemotron-3-super-120b-a12b:free at
#   $0.00/Mtok, and either would be a legitimate rung — but a rung that costs
#   nothing cannot be exhausted by a dollar ceiling, so "refuse at exhaustion"
#   stops being expressible in dollars and falls entirely to max_calls_per_run.
#   A free rung wants a call-count budget, not a money budget. Local weights are
#   also slow: gemma4:31b took 39.6 s (and 86.4 s under load) for the same
#   prompt the frontier rung answered in 2.9 s, so the cheapest rung on a price
#   ladder is not the cheapest rung on a latency ladder.

tiers:
  economy:
    # Every key under `request` is merged verbatim into the gateway's /v1/chat
    # body. That is the whole tier -> provider mapping: no Python edit needed to
    # change a provider, a model, a reasoning effort or a token ceiling.
    request:
      provider: groq
      model: openai/gpt-oss-120b
      reasoning: "off"
      max_tokens: 512
      temperature: 0
    # Which row of pricing.yaml this tier is billed against. Defaults to the
    # request model when omitted.
    price_model: openai/gpt-oss-120b
    # What the estimator assumes before the call returns, in tokens. Real usage
    # replaces this the moment the response lands.
    projected_input_tokens: 1200
    projected_output_tokens: 400

  standard:
    request:
      provider: gemini
      model: gemini-3.1-flash-lite
      reasoning: "off"
      max_tokens: 1024
      temperature: 0
    price_model: gemini-3.1-flash-lite
    projected_input_tokens: 2500
    projected_output_tokens: 800

  frontier:
    request:
      provider: gemini
      model: gemini-2.5-flash
      # Left alone deliberately, as gpt-4.1 was: this model answers without the
      # dial and did not show the burn-the-budget-thinking failure that forces
      # `reasoning: "off"` on the economy rung and on zai-glm-4.7.
      max_tokens: 4096
      temperature: 0
    price_model: gemini-2.5-flash
    # Gemini's context is 1M, so 6000 + 4096 fits with room to spare. The cerebras
    # attempt had to shrink these to 3000 to stay inside an 8k ceiling.
    projected_input_tokens: 6000
    projected_output_tokens: 2000

# Which tier a graph ROLE asks for. Keys are the runtime's own skill/role names
# (never task content), so a node "declares the tier it needs" by declaring its
# role. `default` covers every role not listed.
role_tiers:
  default: standard
  memory_recall: economy
  remember_explicit_fact: economy
  web_search: economy
  fetch_url: economy
  index_file: economy
  list_directory: economy
  read_file: economy
  create_reminder: economy
  researcher: economy
  retriever: economy
  summariser: economy
  formatter: economy
  distiller: standard
  content: standard
  coder_validator: standard
  compose_surface: standard
  answer_with_evidence: frontier
