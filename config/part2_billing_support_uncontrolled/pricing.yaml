# Per-MODEL pricing for the Loomstack billing-support triage task class.
#
# Identical to config/pricing.yaml except for one added row: openrouter's
# deepseek/deepseek-chat, this ladder's frontier rung (config/tiers.yaml
# alongside this file). Every other row is carried over unchanged so a model
# outside this ladder (e.g. one the judge panel calls) still prices.

currency: USD
unit_tokens: 1000000

default:
  input: 1.00
  output: 5.00

models:
  # Google
  gemini-3.1-flash-lite:
    input: 0.25
    output: 1.50
    measured_latency_ms: 1236
    measured_reference_usd: 0.00014125
    measured_non_empty: true
  gemini-3.1-flash: {input: 0.50, output: 3.00}
  gemini-3.1-pro: {input: 2.00, output: 12.00}
  # Open weight / hosted
  deepseek-ai/deepseek-v4-pro: {input: 0.14, output: 0.28}
  meta/llama-3.1-8b-instruct: {input: 0.0, output: 0.0}
  openai/gpt-oss-120b:
    input: 0.15
    output: 0.75
    measured_latency_ms: 744
    measured_reference_usd: 0.0001029
    measured_non_empty: true
    measured_needs_reasoning_off: true
  zai-glm-4.7: {input: 0.50, output: 0.50}
  nvidia/nemotron-3-super-120b-a12b:free: {input: 0.0, output: 0.0}
  # This ladder's OWN frontier rung (config/tiers.yaml). Fetched live from
  # openrouter.ai/deepseek/deepseek-chat on 2026-08-05: $0.2574 in / $1.029
  # out per Mtok, OpenRouter's listed rate for DeepSeek-V3's non-reasoning
  # chat variant with its "10% off" promotion already applied. Verify before
  # relying on it for anything beyond this measurement -- OpenRouter rates
  # and promotions both drift.
  deepseek/deepseek-chat:
    input: 0.2574
    output: 1.029
    price_source: "openrouter.ai/deepseek/deepseek-chat, fetched 2026-08-05"
  # Shipped ladder's frontier rung. NOT REACHABLE as of 2026-08-05: GitHub
  # Models returned 410 (a scheduled retirement brownout) -- see
  # docs/part1_validation.md Section 4. Kept priced here so a comparison
  # against the shipped ladder still has a number to compare against, even
  # though this task class's own ladder does not route to it.
  openai/gpt-4.1:
    input: 2.00
    output: 8.00
    measured_latency_ms: 2883
    measured_reference_usd: 0.000682
    measured_non_empty: true
  gemma4:31b:
    input: 0.0
    output: 0.0
    measured_latency_ms: 39570
    measured_non_empty: true
  # Anthropic
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 3.00, output: 15.00}
  claude-opus-5: {input: 5.00, output: 25.00}
  # OpenAI
  gpt-5.6-luna: {input: 1.00, output: 6.00}
  gpt-5.6-terra: {input: 2.50, output: 15.00}
  gpt-5.6-sol: {input: 5.00, output: 30.00}
  ollama: {input: 0.0, output: 0.0}

cache_read_multiplier: 0.1
cache_write_multiplier: 1.25
