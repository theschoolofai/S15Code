# Per-MODEL pricing. No price is ever hardcoded in Python.
#
# Prices are per `unit_tokens` tokens in `currency`.
#
# ── These rates are DECLARED, not billed ─────────────────────────────────────
#
# Every model this ladder reaches runs on a local Ollama daemon. The true
# marginal cost of a call is electricity, so an honest table of billed amounts
# would read $0.00 in every row — and a ladder that costs nothing cannot be
# exhausted by a dollar ceiling, which would make "refuse at exhaustion"
# inexpressible in money and leave §8, §9 and §10 of this session with nothing
# to measure.
#
# So each rate below is anchored to what the 2026 hosted market charges for an
# open-weight model of the same class, and the anchor is written next to it.
# What that buys is a ladder with a realistic SHAPE (~10x bottom to top) over
# which the break-even arithmetic is meaningful.
#
# What is measured and what is declared, exactly:
#
#   measured   input tokens, output tokens, latency, stop reason, whether the
#              answer was empty, whether the judge resolved it, every admission
#              decision, every refusal
#   declared   the per-token rate, and therefore every dollar figure derived
#              from it
#
# The `measured_*` keys are documentation: the loader reads `input` and `output`
# and ignores the rest, so re-measuring is a config edit. They are filled in
# from the first live ladder run (see docs/evidence/).

currency: USD
unit_tokens: 1000000

# Used when a model has no row below, so an unknown model is never silently free.
default:
  input: 1.00
  output: 5.00

models:
  # ── The ladder ─────────────────────────────────────────────────────────────
  # LADDER rung 1 (economy). llama3.2:1b, 1.2B params, on the 11434 daemon.
  # Anchor: 1B-class open weights on the 2026 hosted market, ~$0.10/$0.40 Mtok.
  llama3.2:1b:
    input: 0.10
    output: 0.40

  # LADDER rung 2 (standard). qwen2.5:3b, 3.1B params, on the 11434 daemon.
  # Anchor: 3B-class open weights, ~$0.30/$1.20 Mtok.
  qwen2.5:3b:
    input: 0.30
    output: 1.20

  # LADDER rung 3 (frontier). qwen2.5:7b, 7.6B params, on the 11435 daemon.
  # Anchor: 7B-class open weights, ~$1.00/$4.00 Mtok. Ten times the bottom rung
  # on input, ten times on output.
  qwen2.5:7b:
    input: 1.00
    output: 4.00

  # ── The judge ──────────────────────────────────────────────────────────────
  # Priced on the same card, because the cost of deciding whether an answer
  # resolved a task belongs beside the cost of producing it. §12 of the session
  # is about exactly this number, and it is the one usually left out.
  phi4-mini:
    input: 0.30
    output: 1.20

  # Local inference with no row above is genuinely free.
  ollama: {input: 0.0, output: 0.0}

# Cache accounting, applied when the gateway reports cache token counts.
# A cache read is billed at `cache_read_multiplier` x the input price; writing a
# cache entry is billed at `cache_write_multiplier`.
cache_read_multiplier: 0.1
cache_write_multiplier: 1.25
