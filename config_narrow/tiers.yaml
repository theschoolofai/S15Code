# ─────────────────────────────────────────────────────────────────────────────
# NARROW LADDER — the control arm of the Part 2 crossover experiment.
#
# Identical to ../config in every respect EXCEPT the token ceiling: all three
# rungs get max_tokens 1024 and projected_input_tokens 2000. Same three models,
# same three providers, same prices, same budget policy, same judge panel.
#
# WHY. The wide ladder in ../config spreads 32.5x, which puts the break-even
# resolution rate at r* = 6.0% (k=2). The cheap rung would have to fail 94% of
# tasks before costing more per RESOLVED task — so the signature failure mode is
# unreachable there and cannot be measured, only ruled out.
#
# Equalising the ceiling removes the compounding effect of a wider max_tokens
# and leaves only the price difference between the models:
#
#   economy   gpt-oss-120b            0.15/0.75   projected $0.001068
#   standard  gemini-3.5-flash-lite   0.30/2.50   projected $0.003160
#   frontier  nemotron-3-ultra-550b   0.60/3.60   projected $0.004886
#   spread 4.57x  ->  r* = 35.9% at k=2
#
# That rate IS reachable, so running the same task file against both configs
# shows the mechanism rather than a single data point: only the spread changes,
# and the verdict changes with it.
#
#   S15_CONFIG_DIR=$(pwd)/config_narrow \
#     uv run python proofs/p1_cost_per_task.py --tasks proofs/tasks/llm_cost_engineering.jsonl
# ─────────────────────────────────────────────────────────────────────────────

# Capability tiers.
#
# A tier is a NAME plus the gateway request fields that name expands to. Nothing
# in s15code knows any of these names, providers or models: add a tier, rename a
# tier, or repoint one at a different provider entirely by editing this file.
#
# `order` is the ladder, cheapest first. `policy.py` walks it downwards when the
# run is under budget pressure, so the order is the only thing that defines what
# "downgrade" means.

order: [economy, standard, frontier]
default_tier: standard

# ── The ladder is CROSS-MODEL ────────────────────────────────────────────────
# The first version of this file varied reasoning effort and the output ceiling
# on ONE model. The arithmetic worked — output is billed 6x input, so capping
# max_tokens does cap spend — but it made "model routing" only half-true: every
# rung of the ladder was the same model, so a downgrade could never be a change
# of model, only a change of how hard that one model was allowed to think.
#
# Each rung below is a DIFFERENT model on a DIFFERENT provider, and the three
# were measured against glc_v4 on 2026-07-30 before being written down. One
# identical 3-sentence prompt, max_tokens 512, temperature 0, reasoning off:
#
#   rung      provider    model                          $/Mtok in/out latency answered
#   economy   groq        openai/gpt-oss-120b            0.15 / 0.75   0.76 s  yes
#   standard  gemini      gemini-3.5-flash-lite          0.30 / 2.50   0.89 s  yes
#   frontier  nvidia      nvidia/nemotron-3-ultra-550b   0.60 / 3.60   3.52 s  yes
#
# Input rate, output rate and latency all rise monotonically along the ladder,
# which is what makes "one rung down" unambiguous. Projected worst-case cost per
# call (the number admission actually uses) is $0.000564 / $0.003310 / $0.018346
# — a 32.5x spread across the ladder, where the same-model ladder managed 5x.
#
# ── Why this ladder is not the one measured on 2026-07-30 ────────────────────
# The frontier rung was `github / openai/gpt-4.1` at 2.00/8.00, measured 2.88 s.
# GitHub Models was RETIRED on 2026-07-30 — the same day this file recorded its
# measurement — after brownouts on 16 and 23 July. Verified dead on 2026-08-06:
# every request returns HTTP 410 `github_models_retirement_brownout`, including
# the /catalog/models endpoint and requests naming no model at all. 17 model IDs
# across 7 vendors were tried; a deliberately invalid ID returned 410 rather
# than 404, which proves the endpoint short-circuits before model resolution.
#
# The rung was repointed to NVIDIA on 2026-08-06. Prices below are OpenRouter's
# published rates for the IDENTICAL models, since NVIDIA's free tier bills $0
# and a free rung cannot be exhausted by a dollar ceiling. Note the resulting
# mixed provenance: the economy row keeps its original 0.15/0.75 basis.
#
# Rejected frontier candidates, all measured 2026-08-06 on the same prompt:
#   z-ai/glm-5.2                    correct, but 121-156 s per call — and a
#                                   ONE-WORD answer still took 121 s, so it is
#                                   queue depth, not cold start or generation.
#   deepseek-ai/deepseek-v4-flash   correct, 144 s.
#   deepseek-ai/deepseek-v4-pro     182 s then an EMPTY error — the same trap
#                                   pricing.yaml recorded on 2026-07-30, still
#                                   live a week later. It also tripped the
#                                   breaker and benched all of nvidia for 600 s,
#                                   so the very next probe (llama-3.3-70b) was
#                                   refused without ever being attempted.
#   nvidia/nemotron-4-340b-instruct 404 — listed in the catalog, not deployed.
#   meta/llama-3.1-405b-instruct    not in the catalog at all (largest is 70B).
#
# Two facts worth keeping, both learned the hard way:
#
#   `reasoning: "off"` is not decoration on the cheap rung. gpt-oss-120b thinks
#   by default: at max_tokens 128 with the dial left alone it spent all 128
#   output tokens in its reasoning channel and returned content "" — a fully
#   billed non-answer. The same call with the dial off returned a 570-character
#   answer in 117 tokens. glc_v4's providers.py now translates "off" into the
#   dialect each server understands; the tier only has to ask.
#
#   The cheapest rung is deliberately NOT free. This gateway can also reach
#   ollama/gemma4:31b and openrouter's nvidia/nemotron-3-super-120b-a12b:free at
#   $0.00/Mtok, and either would be a legitimate rung — but a rung that costs
#   nothing cannot be exhausted by a dollar ceiling, so "refuse at exhaustion"
#   stops being expressible in dollars and falls entirely to max_calls_per_run.
#   A free rung wants a call-count budget, not a money budget. Local weights are
#   also slow: gemma4:31b took 39.6 s (and 86.4 s under load) for the same
#   prompt the frontier rung answered in 2.9 s, so the cheapest rung on a price
#   ladder is not the cheapest rung on a latency ladder.

tiers:
  economy:
    # Every key under `request` is merged verbatim into the gateway's /v1/chat
    # body. That is the whole tier -> provider mapping: no Python edit needed to
    # change a provider, a model, a reasoning effort or a token ceiling.
    request:
      provider: groq
      model: openai/gpt-oss-120b
      reasoning: "off"
      max_tokens: 1024
      temperature: 0
    # Which row of pricing.yaml this tier is billed against. Defaults to the
    # request model when omitted.
    price_model: openai/gpt-oss-120b
    # What the estimator assumes before the call returns, in tokens. Real usage
    # replaces this the moment the response lands.
    projected_input_tokens: 2000
    projected_output_tokens: 400

  standard:
    request:
      provider: gemini
      # Moved off gemini-3.1-flash-lite on 2026-08-06: same capability class,
      # but 3.5 carries the more generous per-minute and per-day allowances.
      # Measured 21 in / 68 out, 885 ms, 466 chars.
      model: gemini-3.5-flash-lite
      # Sent, but the gateway reports reasoning_applied=False for this model —
      # it appears to have no thinking channel to switch off. Harmless to ask.
      reasoning: "off"
      max_tokens: 1024
      temperature: 0
    price_model: gemini-3.5-flash-lite
    projected_input_tokens: 2000
    projected_output_tokens: 800

  frontier:
    request:
      provider: nvidia
      # Repointed from github/openai/gpt-4.1 on 2026-08-06; see the header for
      # why. Measured 36 in / 95 out, 3.52 s cold and 14.4 s under load, 598
      # chars. NVIDIA prioritises its own Nemotron: third-party models on the
      # same key (glm-5.2, deepseek-v4-flash) queue for 2+ minutes, this does
      # not. Note NVIDIA's free tier also returns 503 "Worker local total
      # request limit reached (32/32)" under concurrency — a transport failure,
      # not a verdict, and one p1's answer path does not currently retry.
      model: nvidia/nemotron-3-ultra-550b-a55b
      # NOT optional, and not decoration. Measured 2026-08-06 at max_tokens 512
      # across three samples: with the dial UNSET this model spent 392-486
      # output tokens per call, of which 1540-2070 characters went to an
      # invisible reasoning channel, for a 450-499 char answer. With the dial
      # off: 95 output tokens, 598 chars, reasoning channel empty. That is 4.7x
      # the output tokens for a worse answer — and the unset run peaked 26
      # tokens short of the 512 ceiling, so one more verbose sample truncates or
      # returns "" at full price. This is the session's own empty-string bug,
      # reproduced on a model that did not exist when it was first written.
      reasoning: "off"
      max_tokens: 1024
      temperature: 0
    price_model: nvidia/nemotron-3-ultra-550b-a55b
    projected_input_tokens: 2000
    projected_output_tokens: 2000

# Which tier a graph ROLE asks for. Keys are the runtime's own skill/role names
# (never task content), so a node "declares the tier it needs" by declaring its
# role. `default` covers every role not listed.
role_tiers:
  default: standard
  memory_recall: economy
  remember_explicit_fact: economy
  web_search: economy
  fetch_url: economy
  index_file: economy
  list_directory: economy
  read_file: economy
  create_reminder: economy
  researcher: economy
  retriever: economy
  summariser: economy
  formatter: economy
  distiller: standard
  content: standard
  coder_validator: standard
  compose_surface: standard
  answer_with_evidence: frontier
